<body>
    <header class="navegador">
        <nav class="menu">

    <main>
        <section class="seccion-cotizacion">
            <div class="encabezado-cotizacion">
                <h2>SOLICTAR COTIZACION</h2>
                <p class="aclaracion">Rellena el siguiente formulario para recibir más información sobre tu próximo
                    Chevrolet Corvette</p>
                <p> Los campos marcados con un * son obligatorios.</p>
                <form action="" class="formulario-cotizacion">
                    <div class="campo">
                        <label for="modelo">¿Qué modelo te interesa? *</label>
                        <input type="text" id="modelo" name="modelo">
                    </div>
                    <div class="campo">
                        <label for="fecha">Fecha estimada de compra *</label>
                        <input type="date" id="fecha" name="fecha">
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre">
                    </div>
                    <div class="campo">
                        <label for="apellido">Apellido *</label>
                        <input type="text" name="apellido" id="apellido" placeholder="Ingresá tu apellido">
                    </div>
                    <div class="campo">
                        <label for="mail">Correo electronico *</label>
                        <input type="email" name="" id="">
                    </div>
                    <div class="campo">
                        <label for="telefono">Telefono de contacto</label>
                        <input type="number" name="" id="">

                    </div>

                </form>

            </div>

        </section>
    </main>

    <footer class="">
    </footer>
